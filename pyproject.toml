[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical_simulation_of_shsvd"
version = "0.2.0"
description = "Numerical solvers for stochastic hybrid systems of variable dimension"
readme = "README.md"
authors = [
    { name = "Marvin Schulte", email = "marvin.schulte@itwm.fraunhofer.de" },
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "sphinx"
]

[tool.setuptools.packages.find]
include = ["numerical_simulation_of_shsvd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=numerical_simulation_of_shsvd --cov-report=term-missing"

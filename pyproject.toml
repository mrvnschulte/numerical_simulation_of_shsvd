[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical_simulation_of_shsvd"
version = "0.1.0"
description = "Package for numerically solving stochastic hybrid systems of variable dimension (SHSVD)"
readme = "README.md"

authors = [
    {name = "Marvin Schulte", email = "marvin.schulte@itwm.fraunhofer.de"}
]

requires-python = ">=3.9"

dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["numerical_simulation_of_shsvd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=numerical_simulation_of_shsvd --cov-report=term-missing"